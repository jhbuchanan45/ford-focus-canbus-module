<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="1000" height="720" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#e0e0e0">Ford Focus Mk3 MS-CAN Decoder — Wiring Diagram (Option A: RZ-FD09 Harness Tap)</text>
  <text x="500" y="50" text-anchor="middle" font-size="11" fill="#888">Power: ATOTO spare CarPlay USB → Blue Pill USB port  |  Only 3 wires from harness: CAN H / CAN L / GND</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- RZ-FD09 10-pin connector (left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="rz-fd09">
    <!-- Housing -->
    <rect x="30" y="90" width="160" height="310" rx="6" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="110" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#e0e0e0">RZ-FD09</text>
    <text x="110" y="128" text-anchor="middle" font-size="10" fill="#aaa">10-pin harness</text>
    <text x="110" y="142" text-anchor="middle" font-size="10" fill="#aaa">connector (loom side)</text>

    <!-- Pin rows -->
    <!-- Pin 1 — Teal MS-CAN H -->
    <circle cx="55" cy="175" r="7" fill="#009688" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="179" font-size="10" fill="#009688">Teal — MS-CAN H</text>

    <!-- Pin 2 — White MS-CAN L -->
    <circle cx="55" cy="205" r="7" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="209" font-size="10" fill="#e0e0e0">White — MS-CAN L</text>

    <!-- Pin 3 — Black GND -->
    <circle cx="55" cy="235" r="7" fill="#444" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="239" font-size="10" fill="#ccc">Black — GND</text>

    <!-- Pin 4 — Pink Reverse (optional) -->
    <circle cx="55" cy="265" r="7" fill="#e91e8c" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="269" font-size="10" fill="#e91e8c">Pink — Reverse (opt)</text>

    <!-- Pins 5-10 unused -->
    <circle cx="55" cy="295" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <circle cx="55" cy="320" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <circle cx="55" cy="345" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <circle cx="55" cy="370" r="5" fill="#333" stroke="#666" stroke-width="1"/>
    <text x="70" y="299" font-size="9" fill="#555">· (unused)</text>
    <text x="70" y="324" font-size="9" fill="#555">· (unused)</text>
    <text x="70" y="349" font-size="9" fill="#555">· (unused)</text>
    <text x="70" y="374" font-size="9" fill="#555">· (unused)</text>

    <!-- T-tap label -->
    <rect x="36" y="158" width="148" height="10" rx="2" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="186" y="166" font-size="9" fill="#777">T-tap</text>

    <!-- Note -->
    <text x="110" y="405" text-anchor="middle" font-size="9" fill="#888">Do not cut — T-tap only</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TJA1042 CAN transceiver (centre-left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="tja1042">
    <!-- IC body -->
    <rect x="310" y="120" width="130" height="240" rx="4" fill="#2a3a2a" stroke="#4caf50" stroke-width="1.5"/>
    <!-- Notch -->
    <path d="M 370 120 Q 375 110 380 120" fill="#1a1a2e" stroke="#4caf50" stroke-width="1"/>

    <text x="375" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#4caf50">TJA1042</text>
    <text x="375" y="160" text-anchor="middle" font-size="10" fill="#81c784">CAN Transceiver</text>

    <!-- Left pins (1-4): signals toward MCU -->
    <!-- Pin 1 TXD -->
    <line x1="310" y1="185" x2="290" y2="185" stroke="#4caf50" stroke-width="2"/>
    <circle cx="290" cy="185" r="3" fill="#4caf50"/>
    <text x="315" y="189" font-size="10" fill="#81c784">1·TXD</text>

    <!-- Pin 2 GND -->
    <line x1="310" y1="210" x2="290" y2="210" stroke="#607d8b" stroke-width="2"/>
    <circle cx="290" cy="210" r="3" fill="#607d8b"/>
    <text x="315" y="214" font-size="10" fill="#90a4ae">2·GND</text>

    <!-- Pin 3 VCC -->
    <line x1="310" y1="235" x2="290" y2="235" stroke="#ff9800" stroke-width="2"/>
    <circle cx="290" cy="235" r="3" fill="#ff9800"/>
    <text x="315" y="239" font-size="10" fill="#ffb74d">3·VCC</text>

    <!-- Pin 4 RXD -->
    <line x1="310" y1="260" x2="290" y2="260" stroke="#4caf50" stroke-width="2"/>
    <circle cx="290" cy="260" r="3" fill="#4caf50"/>
    <text x="315" y="264" font-size="10" fill="#81c784">4·RXD</text>

    <!-- Right pins (5-8): CAN bus side -->
    <!-- Pin 5 VREF -->
    <line x1="440" y1="185" x2="460" y2="185" stroke="#555" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="395" y="189" font-size="10" fill="#555">5·VREF</text>
    <text x="465" y="189" font-size="9" fill="#555">n/c</text>

    <!-- Pin 6 CANL -->
    <line x1="440" y1="210" x2="460" y2="210" stroke="#f5f5f5" stroke-width="2"/>
    <circle cx="460" cy="210" r="3" fill="#f5f5f5"/>
    <text x="395" y="214" font-size="10" fill="#e0e0e0">6·CANL</text>

    <!-- Pin 7 CANH -->
    <line x1="440" y1="235" x2="460" y2="235" stroke="#009688" stroke-width="2"/>
    <circle cx="460" cy="235" r="3" fill="#009688"/>
    <text x="395" y="239" font-size="10" fill="#4db6ac">7·CANH</text>

    <!-- Pin 8 STB -->
    <line x1="440" y1="260" x2="460" y2="260" stroke="#607d8b" stroke-width="2"/>
    <circle cx="460" cy="260" r="3" fill="#607d8b"/>
    <text x="395" y="264" font-size="10" fill="#90a4ae">8·STB</text>

    <!-- Pin label area bottom -->
    <text x="375" y="340" text-anchor="middle" font-size="9" fill="#555">SOIC-8</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- STM32F103C8T6 Blue Pill (centre-right) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="bluepill">
    <!-- PCB outline -->
    <rect x="560" y="80" width="190" height="380" rx="5" fill="#1a237e" stroke="#3f51b5" stroke-width="1.5"/>
    <!-- USB connector at top -->
    <rect x="620" y="65" width="50" height="20" rx="3" fill="#37474f" stroke="#90a4ae" stroke-width="1"/>
    <text x="645" y="78" text-anchor="middle" font-size="9" fill="#90a4ae">USB</text>

    <text x="655" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#7986cb">Blue Pill</text>
    <text x="655" y="121" text-anchor="middle" font-size="10" fill="#9fa8da">STM32F103C8T6</text>

    <!-- LED -->
    <circle cx="655" cy="148" r="6" fill="#f44336" opacity="0.8"/>
    <text x="668" y="152" font-size="9" fill="#ef9a9a">PC13 LED</text>

    <!-- Left-side pins (facing left) -->
    <!-- PB8 CAN RX -->
    <line x1="560" y1="200" x2="540" y2="200" stroke="#4caf50" stroke-width="2"/>
    <circle cx="540" cy="200" r="3" fill="#4caf50"/>
    <text x="565" y="204" font-size="10" fill="#81c784">PB8 (CAN1_RX)</text>

    <!-- PB9 CAN TX -->
    <line x1="560" y1="225" x2="540" y2="225" stroke="#4caf50" stroke-width="2"/>
    <circle cx="540" cy="225" r="3" fill="#4caf50"/>
    <text x="565" y="229" font-size="10" fill="#81c784">PB9 (CAN1_TX)</text>

    <!-- 3V3 -->
    <line x1="560" y1="255" x2="540" y2="255" stroke="#ff9800" stroke-width="2"/>
    <circle cx="540" cy="255" r="3" fill="#ff9800"/>
    <text x="565" y="259" font-size="10" fill="#ffb74d">3V3</text>

    <!-- GND -->
    <line x1="560" y1="280" x2="540" y2="280" stroke="#607d8b" stroke-width="2"/>
    <circle cx="540" cy="280" r="3" fill="#607d8b"/>
    <text x="565" y="284" font-size="10" fill="#90a4ae">GND</text>

    <!-- Right-side pins (facing right) -->
    <!-- PA2 USART2 TX -->
    <line x1="750" y1="310" x2="770" y2="310" stroke="#ff7043" stroke-width="2"/>
    <circle cx="770" cy="310" r="3" fill="#ff7043"/>
    <text x="620" y="314" font-size="10" fill="#ff8a65">PA2 (USART2 TX)</text>

    <!-- PA3 USART2 RX -->
    <line x1="750" y1="335" x2="770" y2="335" stroke="#ff7043" stroke-width="2"/>
    <circle cx="770" cy="335" r="3" fill="#ff7043"/>
    <text x="620" y="339" font-size="10" fill="#ff8a65">PA3 (USART2 RX)</text>

    <!-- PA9 USART1 TX debug -->
    <line x1="750" y1="365" x2="770" y2="365" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="770" cy="365" r="3" fill="#9c27b0"/>
    <text x="620" y="369" font-size="10" fill="#ce93d8">PA9 (USART1 TX debug)</text>

    <!-- PA10 USART1 RX debug -->
    <line x1="750" y1="390" x2="770" y2="390" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="770" cy="390" r="3" fill="#9c27b0"/>
    <text x="620" y="394" font-size="10" fill="#ce93d8">PA10 (USART1 RX debug)</text>

    <!-- GND right side -->
    <line x1="750" y1="420" x2="770" y2="420" stroke="#607d8b" stroke-width="2"/>
    <circle cx="770" cy="420" r="3" fill="#607d8b"/>
    <text x="620" y="424" font-size="10" fill="#90a4ae">GND</text>

    <!-- USB note -->
    <text x="655" y="445" text-anchor="middle" font-size="9" fill="#5c6bc0">PA11/PA12 = USB CDC</text>
    <text x="655" y="458" text-anchor="middle" font-size="9" fill="#5c6bc0">(Phase 1 JSON log)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ATOTO 8-pin CAN socket (bottom-right) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="atoto-can">
    <rect x="790" y="265" width="175" height="130" rx="5" fill="#2d2d2d" stroke="#ff7043" stroke-width="1.5"/>
    <text x="877" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff7043">ATOTO 8-pin</text>
    <text x="877" y="298" text-anchor="middle" font-size="10" fill="#ff8a65">CAN Box Socket</text>

    <!-- UART RX (head unit receives) -->
    <circle cx="810" cy="320" r="5" fill="#ff7043" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="324" font-size="10" fill="#ff8a65">UART-RX ← PA2 (TX)</text>

    <!-- UART TX (head unit sends) -->
    <circle cx="810" cy="345" r="5" fill="#ff7043" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="349" font-size="10" fill="#ff8a65">UART-TX → PA3 (RX)</text>

    <!-- GND -->
    <circle cx="810" cy="370" r="5" fill="#607d8b" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="374" font-size="10" fill="#90a4ae">GND</text>

    <text x="877" y="390" text-anchor="middle" font-size="9" fill="#888">38400 baud 8N1</text>
    <text x="877" y="402" text-anchor="middle" font-size="9" fill="#888">Raise VW PQ protocol</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ATOTO USB (CarPlay USB port — power) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="atoto-usb">
    <rect x="790" y="430" width="175" height="95" rx="5" fill="#2d2d2d" stroke="#ffeb3b" stroke-width="1.5"/>
    <text x="877" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffeb3b">ATOTO CarPlay USB</text>
    <text x="877" y="462" text-anchor="middle" font-size="10" fill="#fff176">(spare port — 5 V)</text>

    <circle cx="810" cy="485" r="5" fill="#ffeb3b" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="489" font-size="10" fill="#fff176">5 V VBUS</text>

    <circle cx="810" cy="508" r="5" fill="#607d8b" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="512" font-size="10" fill="#90a4ae">GND</text>

    <text x="877" y="523" text-anchor="middle" font-size="9" fill="#888">Phase 2: in-car power</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- USB-UART debug adapter (optional, bottom-left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="debug-uart">
    <rect x="790" y="560" width="175" height="100" rx="5" fill="#1a1a2e" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="877" y="578" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c27b0">CP2102 / CH340</text>
    <text x="877" y="592" text-anchor="middle" font-size="10" fill="#ce93d8">USB-UART (optional)</text>

    <circle cx="810" cy="612" r="5" fill="#9c27b0" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="616" font-size="10" fill="#ce93d8">RX ← PA9 (TX)</text>

    <circle cx="810" cy="635" r="5" fill="#9c27b0" stroke="#ccc" stroke-width="1"/>
    <text x="822" y="639" font-size="10" fill="#ce93d8">TX → PA10 (RX)</text>

    <text x="877" y="655" text-anchor="middle" font-size="9" fill="#888">115200 baud</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- WIRES -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- == CAN H: RZ-FD09 Teal → TJA1042 CANH (p7) == -->
  <!-- From connector pin, right along y=175 to y=235 via TJA1042 right side -->
  <polyline points="62,175 200,175 200,235 460,235"
    fill="none" stroke="#009688" stroke-width="2.5"/>
  <text x="205" y="169" font-size="9" fill="#4db6ac">CAN H</text>

  <!-- == CAN L: RZ-FD09 White → TJA1042 CANL (p6) == -->
  <polyline points="62,205 215,205 215,210 460,210"
    fill="none" stroke="#e0e0e0" stroke-width="2.5"/>
  <text x="205" y="203" font-size="9" fill="#bdbdbd">CAN L</text>

  <!-- == TJA1042 RXD (p4) → Blue Pill PB8 == -->
  <!-- p4 exits left at y=260, route to PB8 at x=540, y=200 -->
  <polyline points="290,260 270,260 270,200 540,200"
    fill="none" stroke="#4caf50" stroke-width="2"/>
  <text x="272" y="230" font-size="9" fill="#81c784" transform="rotate(-90,272,230)">RXD→PB8</text>

  <!-- == Blue Pill PB9 → TJA1042 TXD (p1) == -->
  <!-- PB9 exits left at y=225, route to p1 at y=185 -->
  <polyline points="540,225 255,225 255,185 290,185"
    fill="none" stroke="#4caf50" stroke-width="2"/>
  <text x="257" y="207" font-size="9" fill="#81c784" transform="rotate(-90,257,207)">PB9→TXD</text>

  <!-- == TJA1042 VCC (p3) → Blue Pill 3V3 == -->
  <polyline points="290,235 280,235 280,255 540,255"
    fill="none" stroke="#ff9800" stroke-width="2"/>

  <!-- == GND: RZ-FD09 Black → TJA1042 GND (p2) and Blue Pill GND == -->
  <!-- From RZ-FD09 black pin (y=235), down to bus rail at y=590 -->
  <line x1="62" y1="235" x2="62" y2="590" stroke="#607d8b" stroke-width="2"/>
  <!-- GND bus left side, across bottom -->
  <line x1="62" y1="590" x2="650" y2="590" stroke="#607d8b" stroke-width="2"/>
  <!-- TJA1042 GND (p2, y=210) down to y=590 then connect -->
  <polyline points="290,210 240,210 240,590" fill="none" stroke="#607d8b" stroke-width="2"/>
  <!-- Blue Pill GND (left, y=280) down to GND bus -->
  <polyline points="540,280 500,280 500,590" fill="none" stroke="#607d8b" stroke-width="2"/>
  <!-- TJA1042 STB (p8, y=260) down to GND bus -->
  <polyline points="460,260 480,260 480,590" fill="none" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="483" y="275" font-size="8" fill="#78909c">STB→GND</text>

  <!-- GND label on bus -->
  <text x="300" y="585" font-size="9" fill="#78909c">GND bus</text>

  <!-- == Blue Pill PA2 (TX) → ATOTO 8-pin UART-RX == -->
  <polyline points="770,310 790,310"
    fill="none" stroke="#ff7043" stroke-width="2"/>

  <!-- == ATOTO 8-pin UART-TX → Blue Pill PA3 (RX) == -->
  <polyline points="790,345 770,345"
    fill="none" stroke="#ff7043" stroke-width="2"/>

  <!-- == ATOTO 8-pin GND → Blue Pill GND (right side) == -->
  <polyline points="790,370 770,420"
    fill="none" stroke="#607d8b" stroke-width="1.5"/>

  <!-- == ATOTO CarPlay USB → Blue Pill USB == -->
  <!-- Power line from ATOTO USB 5V to Blue Pill USB port (top) -->
  <polyline points="877,430 877,610 645,610 645,85"
    fill="none" stroke="#ffeb3b" stroke-width="2.5"/>
  <text x="710" y="625" font-size="9" fill="#fff176">5V USB (Phase 2: in-car power)</text>
  <text x="643" y="63" font-size="9" fill="#fff176" text-anchor="middle">5V</text>

  <!-- == Debug UART PA9 → CP2102 RX == -->
  <line x1="770" y1="365" x2="790" y2="612" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- == Debug UART PA10 ← CP2102 TX == -->
  <line x1="770" y1="390" x2="790" y2="635" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 120Ω termination note -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="termination">
    <rect x="30" y="440" width="260" height="60" rx="4" fill="#1a1a2e" stroke="#ff9800" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="160" y="458" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff9800">⚠ Bus Termination</text>
    <text x="160" y="473" text-anchor="middle" font-size="9" fill="#ffb74d">Measure CANH–CANL with ignition off:</text>
    <text x="160" y="486" text-anchor="middle" font-size="9" fill="#ffb74d">~60Ω = none needed  |  ~120Ω = fit 120Ω resistor</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Protocol note -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="protocol-note">
    <rect x="30" y="515" width="260" height="75" rx="4" fill="#1a1a2e" stroke="#3f51b5" stroke-width="1"/>
    <text x="160" y="533" text-anchor="middle" font-size="10" font-weight="bold" fill="#7986cb">ATOTO Settings</text>
    <text x="160" y="548" text-anchor="middle" font-size="9" fill="#9fa8da">Settings → Factory → CAN Box:</text>
    <text x="160" y="563" text-anchor="middle" font-size="9" fill="#9fa8da">Select  "Raise VW PQ"</text>
    <text x="160" y="578" text-anchor="middle" font-size="9" fill="#9fa8da">MS-CAN: 125 kbps  |  UART: 38400 baud 8N1</text>
    <text x="160" y="590" text-anchor="middle" font-size="9" fill="#9fa8da">CAN1 remapped: PB8 (RX) / PB9 (TX)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g id="legend">
    <rect x="30" y="600" width="260" height="105" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
    <text x="160" y="618" text-anchor="middle" font-size="10" font-weight="bold" fill="#ccc">Legend</text>

    <line x1="45" y1="633" x2="85" y2="633" stroke="#009688" stroke-width="2.5"/>
    <text x="92" y="637" font-size="9" fill="#4db6ac">MS-CAN H (teal wire)</text>

    <line x1="45" y1="650" x2="85" y2="650" stroke="#e0e0e0" stroke-width="2.5"/>
    <text x="92" y="654" font-size="9" fill="#bdbdbd">MS-CAN L (white wire)</text>

    <line x1="45" y1="667" x2="85" y2="667" stroke="#607d8b" stroke-width="2"/>
    <text x="92" y="671" font-size="9" fill="#90a4ae">GND (black wire)</text>

    <line x1="45" y1="684" x2="85" y2="684" stroke="#ff9800" stroke-width="2"/>
    <text x="92" y="688" font-size="9" fill="#ffb74d">3.3 V supply</text>

    <line x1="150" y1="633" x2="190" y2="633" stroke="#4caf50" stroke-width="2"/>
    <text x="197" y="637" font-size="9" fill="#81c784">CAN peripheral</text>

    <line x1="150" y1="650" x2="190" y2="650" stroke="#ff7043" stroke-width="2"/>
    <text x="197" y="654" font-size="9" fill="#ff8a65">Raise UART</text>

    <line x1="150" y1="667" x2="190" y2="667" stroke="#ffeb3b" stroke-width="2.5"/>
    <text x="197" y="671" font-size="9" fill="#fff176">USB power (5 V)</text>

    <line x1="150" y1="684" x2="190" y2="684" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="197" y="688" font-size="9" fill="#ce93d8">Debug UART (optional)</text>

    <text x="45" y="700" font-size="9" fill="#888">Phase 1: USB to laptop  |  Phase 2: USB to ATOTO</text>
  </g>

</svg>
